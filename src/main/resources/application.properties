spring.application.name=cosmo-cats

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmocats}
spring.datasource.username=${DB_USERNAME:cosmocats}
spring.datasource.password=${DB_PASSWORD:cosmocats}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
