openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  version: 2.0.0
  description: >
    API contract for the Intergalactic Marketplace: products, categories, orders and sales reports.
    Errors are returned as RFC 7807 problem details (application/problem+json).
servers:
  - url: http://localhost:8080
tags:
  - name: Products
  - name: Categories
  - name: Orders
  - name: Reports

paths:
  /api/products:
    get:
      tags: [Products]
      summary: Get a page of products
      description: Returns products sorted by id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get a product by id
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: Product or category not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Products]
      summary: Delete a product
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Product is referenced by existing orders
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      description: Returns all categories sorted by title.
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: Category title already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      summary: Get a category by id
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Rename a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category title already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Categories]
      summary: Delete a category
      responses:
        '204':
          description: Category deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Category still has products
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/categories/{id}/products:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      summary: Get product summaries of a category
      description: Returns id, name and price of every product in the category, cheapest first.
      responses:
        '200':
          description: Product summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders:
    get:
      tags: [Orders]
      summary: Get all orders
      description: Returns all orders, newest first.
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
    post:
      tags: [Orders]
      summary: Place an order
      description: >
        Each line's unit price is taken from the product's current price.
        The order gets a generated order number (natural id) and status NEW.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: One or more products not found (all missing ids are listed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{orderNumber}:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    get:
      tags: [Orders]
      summary: Get an order by its order number
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Orders]
      summary: Delete an order with its lines
      responses:
        '204':
          description: Order deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/orders/{orderNumber}/status:
    parameters:
      - $ref: '#/components/parameters/OrderNumber'
    patch:
      tags: [Orders]
      summary: Change the status of an order
      description: Orders that are DELIVERED or CANCELLED can no longer change status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Missing or unknown status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order is already DELIVERED or CANCELLED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/reports/top-products:
    get:
      tags: [Reports]
      summary: Most purchased products
      description: >
        Products ranked by quantity sold in orders that are PAID, SHIPPED or DELIVERED
        and were created in [from, to). Ties are ordered by product name.
      parameters:
        - name: from
          in: query
          description: Start of the window, inclusive. Defaults to 30 days before `to`.
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the window, exclusive. Defaults to now.
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Max number of products in the report
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Report rows, best sellers first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSalesReport'
        '400':
          description: Invalid limit, malformed date or `from` not before `to`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number (0-based)
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Max items per page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNumber:
      name: orderNumber
      in: path
      description: Public order number (natural id)
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed path or query parameter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request body failed validation or could not be read
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate product name in the category
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ProductRequest:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Must contain a cosmic word (e.g. star, galaxy, comet, space, космічний)
        description:
          type: string
        price:
          type: number
          minimum: 0.01
        categoryId:
          type: integer
          format: int64
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        categoryId:
          type: integer
          format: int64
    PagedProductResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
        limit:
          type: integer
        totalElements:
          type: integer
          format: int64
    ProductSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number

    CategoryRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 100
          description: Unique; surrounding whitespace is trimmed
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string

    OrderStatus:
      type: string
      enum: [NEW, PAID, SHIPPED, DELIVERED, CANCELLED]
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    OrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderItemResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          description: Product price at the moment the order was placed
        lineTotal:
          type: number
    OrderResponse:
      type: object
      properties:
        orderNumber:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        totalAmount:
          type: number
          description: Sum of line totals (computed, not stored)

    ProductSalesReport:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        categoryTitle:
          type: string
        totalQuantity:
          type: integer
          format: int64
        totalRevenue:
          type: number

    ErrorResponse:
      type: object
      description: RFC 7807 problem detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
